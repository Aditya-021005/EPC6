services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: epc6-backend
    restart: unless-stopped
    environment:
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production-use-a-long-random-string}
      - ALLOWED_HOSTS=*
      - CSRF_TRUSTED_ORIGINS=http://13.60.94.157,http://localhost
      - DB_PATH=/app/backend/db_data/db.sqlite3
    volumes:
      - db_data:/app/backend/db_data
      - media_data:/app/backend/media
      - static_files:/app/backend/staticfiles
    ports:
      - "8005:8005"
    command: >
      sh -c "mkdir -p /app/backend/db_data &&
        python manage.py migrate --run-syncdb &&
        python manage.py collectstatic --noinput &&
        gunicorn core.wsgi:application --bind 0.0.0.0:8005 --workers 3 --access-logfile - --error-logfile -"

  nginx:
    image: nginx:alpine
    container_name: epc6-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - frontend_dist:/usr/share/nginx/html:ro
      - static_files:/app/backend/staticfiles:ro
      - media_data:/app/backend/media:ro
    depends_on:
      - backend
      - frontend-builder

  frontend-builder:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: epc6-frontend-builder
    volumes:
      - frontend_dist:/output
    entrypoint: ["/bin/sh", "-c", "cp -r /frontend-dist/* /output/ && echo 'Frontend build copied to volume'"]

volumes:
  db_data:
  media_data:
  frontend_dist:
  static_files:
